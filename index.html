<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Importance of Saving Money</title>
  <style>
    :root {
      --bg-primary: #0b1220;
      --bg-secondary: #121c31;
      --bg-panel: #17243f;
      --text-primary: #f4f0e6;
      --text-secondary: #b8c0cf;
      --accent-gold: #c8ab6c;
      --accent-emerald: #4ea77c;
      --danger-soft: #d9958f;
      --focus: #e8d3a1;
      --shadow: 0 12px 30px rgba(2, 8, 18, 0.45);
      --radius: 14px;
      --space-1: 0.5rem;
      --space-2: 0.75rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --space-6: 3rem;
      --font-stack: "Segoe UI", "Inter", "Avenir Next", "Helvetica Neue", Arial, system-ui, sans-serif;
      --transition: 180ms ease;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-stack);
      color: var(--text-primary);
      background: radial-gradient(circle at 15% 10%, #1a2946 0%, transparent 45%),
                  radial-gradient(circle at 80% 90%, #111f35 0%, transparent 40%),
                  var(--bg-primary);
      line-height: 1.45;
    }

    .hidden { display: none !important; }

    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid rgba(200, 171, 108, 0.45);
      border-radius: 10px;
      padding: 0.58rem 0.9rem;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), transform var(--transition);
    }

    button:hover { border-color: var(--accent-gold); background: rgba(200, 171, 108, 0.08); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    a, button, [role="button"], input, textarea, select {
      outline: none;
    }

    a:focus-visible,
    button:focus-visible,
    [role="button"]:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .audience-app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: clamp(0.8rem, 1.8vw, 1.4rem);
      gap: var(--space-3);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .topbar-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .status-pill {
      font-size: 0.82rem;
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(184, 192, 207, 0.35);
      color: var(--text-secondary);
      background: rgba(18, 28, 49, 0.7);
    }

    .status-pill.warn {
      color: #f0cf97;
      border-color: rgba(240, 207, 151, 0.5);
    }

    .viewport-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .slide-viewport {
      width: min(100%, 1220px);
      aspect-ratio: 16 / 9;
      background: linear-gradient(145deg, rgba(18, 28, 49, 0.94), rgba(12, 20, 35, 0.96));
      border: 1px solid rgba(200, 171, 108, 0.22);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .slide-frame {
      width: 100%;
      height: 100%;
      padding: clamp(1.1rem, 2.5vw, 2.2rem);
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      animation: slideIn var(--transition) forwards;
    }

    @keyframes slideIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .texture {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(circle at 20% 20%, black 30%, transparent 75%);
      opacity: 0.45;
    }

    .slide-layout {
      height: 100%;
      display: grid;
      gap: var(--space-4);
      align-content: stretch;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 0.76rem;
      color: var(--accent-gold);
      margin-bottom: var(--space-1);
    }

    .headline {
      font-size: clamp(1.5rem, 3.2vw, 2.7rem);
      line-height: 1.14;
      margin: 0;
      max-width: 16ch;
    }

    .subtitle {
      margin: 0;
      font-size: clamp(1rem, 1.8vw, 1.28rem);
      color: var(--text-secondary);
      max-width: 52ch;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: var(--space-2);
    }

    .chip {
      border-radius: 999px;
      padding: 0.42rem 0.7rem;
      border: 1px solid rgba(200, 171, 108, 0.42);
      font-size: 0.88rem;
      color: #eadcbf;
      background: rgba(200, 171, 108, 0.08);
    }

    .split {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: var(--space-4);
      min-height: 0;
    }

    .visual-panel,
    .content-panel {
      border-radius: var(--radius);
      border: 1px solid rgba(184, 192, 207, 0.2);
      background: rgba(15, 24, 41, 0.72);
      padding: var(--space-3);
      min-height: 0;
    }

    .visual-panel svg { width: 100%; height: 100%; display: block; }

    .four-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .mini-card {
      border: 1px solid rgba(184, 192, 207, 0.22);
      border-radius: 12px;
      padding: 0.85rem;
      background: rgba(22, 34, 57, 0.74);
      display: grid;
      gap: 0.45rem;
      align-content: start;
    }

    .mini-card h3 {
      margin: 0;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      color: #eadfc7;
    }

    .mini-card p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; }

    .mini-icon {
      width: 1.35rem;
      height: 1.35rem;
      color: var(--accent-gold);
    }

    .label {
      font-size: 0.82rem;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    .bar-stack {
      display: flex;
      height: 1.2rem;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(184, 192, 207, 0.22);
      background: #0f1828;
    }

    .bar-expenses { background: linear-gradient(90deg, #5f88bd, #7aa0cb); }
    .bar-saving { background: linear-gradient(90deg, #3a8f6a, #57b185); }

    .legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.83rem;
      color: var(--text-secondary);
    }

    .dot {
      width: 0.72rem;
      height: 0.72rem;
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.38rem;
      vertical-align: middle;
    }

    .calc {
      margin: 0;
      color: #d6dded;
      font-size: 0.9rem;
    }

    .kicker {
      margin: 0;
      color: #ebd9ae;
      font-weight: 500;
      font-size: 0.92rem;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .nav-controls,
    .meta-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .progress-nav {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .progress-btn {
      width: 2rem;
      height: 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(184, 192, 207, 0.35);
      background: rgba(184, 192, 207, 0.18);
      padding: 0;
    }

    .progress-btn.active {
      width: 2.45rem;
      background: rgba(200, 171, 108, 0.8);
      border-color: rgba(200, 171, 108, 0.9);
    }

    .popup-warning {
      margin-top: 0.45rem;
      font-size: 0.86rem;
      color: #f2d0a0;
      max-width: 72ch;
    }

    .slide-counter {
      color: var(--text-secondary);
      font-size: 0.9rem;
      min-width: 4.6rem;
      text-align: right;
    }

    .presenter-app {
      display: grid;
      grid-template-columns: minmax(310px, 1fr) minmax(320px, 1fr);
      gap: var(--space-4);
      min-height: 100vh;
      padding: clamp(0.75rem, 1.8vw, 1.2rem);
    }

    .panel {
      border: 1px solid rgba(184, 192, 207, 0.24);
      background: rgba(17, 27, 44, 0.9);
      border-radius: var(--radius);
      padding: var(--space-3);
      display: grid;
      gap: var(--space-3);
      align-content: start;
      min-height: 0;
    }

    .presenter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .presenter-header h2 {
      margin: 0;
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .timer {
      font-size: 1.15rem;
      font-weight: 600;
      color: #ecdcb8;
      letter-spacing: 0.03em;
    }

    .preview {
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      border: 1px solid rgba(184, 192, 207, 0.22);
      background: linear-gradient(140deg, #111d33, #0d1524);
      overflow: hidden;
      padding: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      position: relative;
    }

    .preview h3 {
      margin: 0 0 0.35rem;
      color: var(--text-primary);
      font-size: 0.95rem;
      line-height: 1.2;
    }

    .preview .line {
      height: 0.36rem;
      border-radius: 999px;
      margin-bottom: 0.3rem;
      background: rgba(184, 192, 207, 0.26);
      width: 100%;
    }

    .preview .line.short { width: 65%; }
    .preview .line.medium { width: 82%; }

    .notes-box {
      border: 1px solid rgba(184, 192, 207, 0.22);
      border-radius: 12px;
      padding: 0.9rem;
      background: rgba(16, 25, 41, 0.75);
      overflow: auto;
      min-height: 200px;
      max-height: 54vh;
    }

    .notes-box p {
      margin: 0 0 0.65rem;
      color: #e5e8f1;
      line-height: 1.58;
      font-size: 0.98rem;
    }

    .notes-box p:last-child { margin-bottom: 0; }

    .presenter-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .final-state {
      color: #d5dfef;
      font-size: 0.9rem;
      margin: 0;
    }

    @media (max-width: 1080px) {
      .slide-viewport { aspect-ratio: auto; min-height: 68vh; }
      .split { grid-template-columns: 1fr; }
      .presenter-app { grid-template-columns: 1fr; }
      .notes-box { max-height: none; }
    }

    @media (max-width: 720px) {
      .four-grid { grid-template-columns: 1fr; }
      .headline { max-width: 100%; }
      .slide-counter { text-align: left; }
      .control-row { align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .slide-frame { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main id="audienceApp" class="audience-app" aria-label="Audience presentation view">
    <header class="topbar">
      <h1 id="deckLabel">University Presentation</h1>
      <div class="topbar-controls">
        <span id="syncStatus" class="status-pill" aria-live="polite">Presenter mode: Off</span>
        <button id="startPresenterBtn" type="button">Start Presenter Mode</button>
        <button id="fullscreenBtn" type="button">Enter Fullscreen</button>
      </div>
    </header>

    <div class="viewport-wrap">
      <section class="slide-viewport" aria-live="polite" aria-label="Current slide">
        <article id="slideMount" class="slide-frame"></article>
      </section>
    </div>

    <footer class="control-row">
      <div class="nav-controls">
        <button id="prevBtn" type="button" aria-label="Previous slide">Previous</button>
        <button id="nextBtn" type="button" aria-label="Next slide">Next</button>
        <span class="slide-counter" id="slideCounter" aria-live="polite"></span>
      </div>
      <div class="meta-controls">
        <nav class="progress-nav" id="progressNav" aria-label="Slide progress indicators"></nav>
      </div>
    </footer>
    <p id="popupWarning" class="popup-warning hidden" role="status" aria-live="polite"></p>
  </main>

  <main id="presenterApp" class="presenter-app hidden" aria-label="Presenter dashboard">
    <section class="panel" aria-label="Current slide and controls">
      <div class="presenter-header">
        <h2 id="presenterTitle">Presenter Mode</h2>
        <div class="timer" id="timer" aria-live="polite">00:00</div>
      </div>
      <div>
        <p id="presenterSlideIndicator" class="kicker" style="margin-bottom:0.55rem;"></p>
        <div id="presenterCurrentPreview" class="preview" aria-label="Current slide preview"></div>
      </div>
      <div class="presenter-controls">
        <button id="presenterPrevBtn" type="button" aria-label="Previous slide from presenter window">Previous</button>
        <button id="presenterNextBtn" type="button" aria-label="Next slide from presenter window">Next</button>
        <button id="focusAudienceBtn" type="button">Return to Audience Window</button>
        <button id="endPresenterBtn" type="button">End Presenter Mode</button>
      </div>
      <p id="presenterSyncState" class="status-pill" aria-live="polite">Sync: Connecting…</p>
    </section>

    <section class="panel" aria-label="Speaker notes and next slide">
      <div>
        <p class="label" style="margin:0 0 0.4rem;">Private Speaker Notes</p>
        <div id="presenterNotes" class="notes-box"></div>
      </div>
      <div>
        <p class="label" style="margin:0 0 0.4rem;">Next Slide Preview</p>
        <div id="presenterNextPreview" class="preview" aria-label="Next slide preview"></div>
      </div>
      <p id="presenterFinalState" class="final-state"></p>
    </section>
  </main>

  <script>
    (() => {
      const slides = [
        {
          title: "The Importance of Saving Money",
          subtitle: "Small savings today. Greater security tomorrow.",
          keyConcepts: ["Financial security", "Unexpected expenses", "Future opportunities"],
          notes: [
            "Introduce the topic and explain that saving is not only about accumulating money.",
            "Frame saving as preparation for uncertainty and future needs.",
            "Ask: 'What would happen if we suddenly had an unexpected expense?'",
            "Transition into practical benefits of maintaining savings."
          ],
          duration: "Suggested speaking duration: 30–40 seconds.",
          audienceHtml: `
            <div class="texture"></div>
            <section class="slide-layout split" aria-label="Slide 1 content">
              <div class="content-panel" style="display:grid;align-content:center;gap:1rem;">
                <p class="eyebrow">Opening</p>
                <h2 class="headline">The Importance of Saving Money</h2>
                <p class="subtitle">Small savings today. Greater security tomorrow.</p>
                <div class="chip-list" role="list" aria-label="Key concepts">
                  <span role="listitem" class="chip">Financial security</span>
                  <span role="listitem" class="chip">Unexpected expenses</span>
                  <span role="listitem" class="chip">Future opportunities</span>
                </div>
              </div>
              <div class="visual-panel" aria-hidden="true">
                <svg viewBox="0 0 520 360" role="img" aria-label="Savings jar and coins illustration">
                  <defs>
                    <linearGradient id="jarGlow" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#274266" stop-opacity="0.92"/>
                      <stop offset="100%" stop-color="#13233a" stop-opacity="0.95"/>
                    </linearGradient>
                    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#dfc289"/>
                      <stop offset="100%" stop-color="#b7924d"/>
                    </linearGradient>
                  </defs>
                  <rect x="38" y="40" width="444" height="280" rx="24" fill="rgba(17,28,48,0.45)" stroke="rgba(200,171,108,0.28)"/>
                  <ellipse cx="250" cy="286" rx="145" ry="26" fill="rgba(9,14,24,0.65)"/>
                  <rect x="156" y="98" width="194" height="164" rx="24" fill="url(#jarGlow)" stroke="rgba(214,224,238,0.28)"/>
                  <rect x="172" y="74" width="160" height="38" rx="12" fill="#1b2d4c" stroke="rgba(206,214,229,0.24)"/>
                  <rect x="205" y="56" width="95" height="20" rx="8" fill="#22385a" stroke="rgba(206,214,229,0.2)"/>
                  <circle cx="250" cy="180" r="52" fill="rgba(200,171,108,0.12)" stroke="rgba(200,171,108,0.52)"/>
                  <path d="M252 146v68" stroke="#e7d2a6" stroke-width="9" stroke-linecap="round"/>
                  <path d="M222 170h50" stroke="#e7d2a6" stroke-width="9" stroke-linecap="round"/>
                  <ellipse cx="124" cy="276" rx="28" ry="8" fill="rgba(11,18,32,0.72)"/>
                  <ellipse cx="146" cy="260" rx="26" ry="8" fill="url(#coin)"/>
                  <ellipse cx="122" cy="248" rx="24" ry="8" fill="url(#coin)"/>
                  <ellipse cx="368" cy="266" rx="24" ry="8" fill="url(#coin)"/>
                  <ellipse cx="392" cy="250" rx="20" ry="7" fill="url(#coin)"/>
                  <path d="M388 142c18 22 34 44 40 72" stroke="#4ea77c" stroke-width="5" fill="none" stroke-linecap="round"/>
                  <circle cx="432" cy="219" r="7" fill="#4ea77c"/>
                </svg>
              </div>
            </section>
          `
        },
        {
          title: "Why Is Saving Money Important?",
          subtitle: "Four practical benefits of regular saving.",
          notes: [
            "Explain why an emergency reserve can protect people from sudden shocks.",
            "Give a familiar example such as a broken phone or an unexpected bill.",
            "Show that savings can reduce dependence on borrowing.",
            "Highlight that small, regular contributions can grow over time.",
            "Transition by acknowledging that saving is not equally easy for everyone."
          ],
          duration: "Suggested speaking duration: 40–50 seconds.",
          audienceHtml: `
            <div class="texture"></div>
            <section class="slide-layout" aria-label="Slide 2 content">
              <div>
                <p class="eyebrow">Practical Benefits</p>
                <h2 class="headline" style="max-width:20ch;">Why Is Saving Money Important?</h2>
                <p class="subtitle">Savings can improve stability without promising risk-free outcomes.</p>
              </div>
              <div class="four-grid">
                <article class="mini-card">
                  <svg class="mini-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l7 3v6c0 5-3.3 8.8-7 11-3.7-2.2-7-6-7-11V5l7-3Zm0 4.2-4 1.7V11c0 3.4 1.9 6 4 7.6 2.1-1.6 4-4.2 4-7.6V7.9l-4-1.7Z"/></svg>
                  <h3>SECURITY</h3>
                  <p>Prepare for unexpected expenses and temporary disruptions.</p>
                </article>
                <article class="mini-card">
                  <svg class="mini-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9h-9V3Zm0-2v11h11A11 11 0 0 0 12 1Zm-7.5 20.3 1.4-1.4A8.9 8.9 0 0 1 3 12H1a11 11 0 0 0 3.5 9.3Z"/></svg>
                  <h3>FINANCIAL INDEPENDENCE</h3>
                  <p>Reduce dependence on short-term borrowing for every surprise.</p>
                </article>
                <article class="mini-card">
                  <svg class="mini-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 19h16v2H2V3h2v16Zm4-4h2v2H8v-2Zm4-5h2v7h-2v-7Zm4-3h2v10h-2V7Z"/></svg>
                  <h3>FUTURE GOALS</h3>
                  <p>Prepare for education, key purchases, and personal priorities.</p>
                </article>
                <article class="mini-card">
                  <svg class="mini-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 8a8 8 0 1 0-16 0v5l-2 2v1h20v-1l-2-2V8Zm-8 12a3 3 0 0 0 2.8-2h-5.6A3 3 0 0 0 12 20Z"/></svg>
                  <h3>PEACE OF MIND</h3>
                  <p>Lower daily uncertainty and support calmer decision-making.</p>
                </article>
              </div>
              <div class="content-panel" style="display:grid;gap:0.7rem;">
                <p class="label" style="margin:0;">Illustrative reserve growth from consistent monthly contributions</p>
                <div class="bar-stack" aria-label="Illustrative reserve growth over time">
                  <span style="width:20%;background:#3b4f72"></span>
                  <span style="width:20%;background:#4f688f"></span>
                  <span style="width:20%;background:#6984ac"></span>
                  <span style="width:20%;background:#7f9fc6"></span>
                  <span style="width:20%;background:linear-gradient(90deg,#4b9b77,#5fb78a)"></span>
                </div>
                <p class="kicker">Small, regular contributions can build meaningful reserves over time.</p>
              </div>
            </section>
          `
        },
        {
          title: "Why Do Some People Struggle to Save?",
          subtitle: "Saving challenges often come from both behavior and economic pressure.",
          notes: [
            "Explain that many people have limited resources after paying essential expenses.",
            "Mention housing, food, transport, and other non-optional costs.",
            "Describe how impulse buying and weak budgeting can reduce saving capacity.",
            "Clarify that not everyone struggles because of irresponsible behavior; income limits are real.",
            "State that budgeting improves understanding, but cannot solve all structural income problems.",
            "Transition from personal constraints to the wider economy."
          ],
          duration: "Suggested speaking duration: 40–50 seconds.",
          audienceHtml: `
            <div class="texture"></div>
            <section class="slide-layout" aria-label="Slide 3 content">
              <div>
                <p class="eyebrow">Challenges</p>
                <h2 class="headline" style="max-width:22ch;">Why Do Some People Struggle to Save?</h2>
                <p class="subtitle">Saving capacity depends on income stability, costs, habits, and debt pressure.</p>
              </div>
              <div class="split" style="grid-template-columns:1fr 1fr;">
                <div class="content-panel" style="display:grid;gap:0.72rem;align-content:start;">
                  <article class="mini-card"><h3>1. LOW OR UNSTABLE INCOME</h3><p>Irregular earnings can leave little room after essentials.</p></article>

          duration: "Suggested speaking duration: 50–60 seconds.",
          audienceHtml: `

          duration: "Suggested speaking duration: 30–40 seconds.",
          audienceHtml: `

                  <circle cx="362" cy="124" r="7" fill="#4ea77c"/>

                  <text x="88" y="292" fill="#b9c6dc" font-size="13">small steps</text>

      ];

      const mode = new URLSearchParams(window.location.search).get("mode") === "presenter" ? "presenter" : "audience";
      const channelName = new URLSearchParams(window.location.search).get("channel") || `saving-money-${Date.now()}`;
      const openerSlide = Number(new URLSearchParams(window.location.search).get("slide"));
      const state = {
        currentSlide: Number.isFinite(openerSlide) && openerSlide >= 0 ? Math.min(openerSlide, slides.length - 1) : 0,
        presenterWindow: null,
        startTime: null,
        syncConnected: false,
        syncTransport: "none",
        channel: null,
        syncStatusMessage: "Presenter mode: Off",
        syncWarn: false,
        isFullscreen: false,
        storageKey: `saving-money-sync-${channelName}`,
      };

      const els = {};

      function $(id) {
        return document.getElementById(id);
      }

      function isEditableTarget(target) {
        if (!target) return false;
        const tag = target.tagName;
        return target.isContentEditable || tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      }

      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60).toString().padStart(2, "0");
        const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
        return `${mins}:${secs}`;
      }

      function setSyncStatus(message, warn = false) {
        state.syncStatusMessage = message;
        state.syncWarn = warn;
        const status = mode === "audience" ? els.syncStatus : els.presenterSyncState;
        if (!status) return;

        status.textContent = message;
        status.classList.toggle("warn", warn);
      }

      function renderAudienceSlide() {
        const slide = slides[state.currentSlide];
        els.slideMount.classList.remove("slide-frame");
        void els.slideMount.offsetWidth;
        els.slideMount.classList.add("slide-frame");
        els.slideMount.innerHTML = slide.audienceHtml;
        els.slideCounter.textContent = `Slide ${state.currentSlide + 1} / ${slides.length}`;
        els.deckLabel.textContent = slide.title;
        updateNavigationState();
      }

      function renderProgressIndicators() {
        els.progressNav.innerHTML = "";
        slides.forEach((slide, index) => {
          const btn = document.createElement("button");
          btn.className = "progress-btn" + (index === state.currentSlide ? " active" : "");
          btn.type = "button";
          btn.setAttribute("aria-label", `Go to slide ${index + 1}: ${slide.title}`);
          btn.addEventListener("click", () => goToSlide(index, { source: mode }));
          els.progressNav.appendChild(btn);
        });
      }

      function updateNavigationState() {
        const atStart = state.currentSlide === 0;
        const atEnd = state.currentSlide === slides.length - 1;

        if (mode === "audience") {
          els.prevBtn.disabled = atStart;
          els.nextBtn.disabled = atEnd;
          const dots = Array.from(els.progressNav.children);
          dots.forEach((dot, i) => dot.classList.toggle("active", i === state.currentSlide));
        } else {
          els.presenterPrevBtn.disabled = atStart;
          els.presenterNextBtn.disabled = atEnd;
          els.presenterFinalState.textContent = atEnd
            ? "Final slide reached. You can review previous slides or end presenter mode."
            : "";
        }
      }

      function renderPresenterData() {
        const slide = slides[state.currentSlide];
        const nextSlide = slides[state.currentSlide + 1];
        els.presenterTitle.textContent = `Presenter Mode — ${slide.title}`;
        els.presenterSlideIndicator.textContent = `Current slide: ${state.currentSlide + 1} of ${slides.length}`;

        els.presenterCurrentPreview.innerHTML = `
          <h3>${slide.title}</h3>
          <div class="line medium"></div>
          <div class="line"></div>
          <div class="line short"></div>
          <p class="label" style="margin:0.5rem 0 0;color:#d8dfed;">${slide.subtitle}</p>
        `;

        const noteFragments = [
          ...slide.notes.map((n) => `<p>${n}</p>`),
          `<p style="color:#ebd8ad;"><strong>${slide.duration}</strong></p>`
        ];
        els.presenterNotes.innerHTML = noteFragments.join("");

        if (nextSlide) {
          els.presenterNextPreview.innerHTML = `
            <h3>${nextSlide.title}</h3>
            <div class="line"></div>
            <div class="line short"></div>
            <p class="label" style="margin:0.5rem 0 0;color:#d8dfed;">${nextSlide.subtitle}</p>
          `;
        } else {
          els.presenterNextPreview.innerHTML = `
            <h3>End of presentation</h3>
            <div class="line medium"></div>
            <p class="label" style="margin:0.5rem 0 0;color:#d8dfed;">No next slide.</p>
          `;
        }

        updateNavigationState();
      }

      function goToSlide(next, options = {}) {
        const normalized = Math.max(0, Math.min(slides.length - 1, next));
        if (normalized === state.currentSlide) return;
        state.currentSlide = normalized;

        if (mode === "audience") {
          renderAudienceSlide();
          renderProgressIndicators();
        } else {
          renderPresenterData();
        }

        if (!options.remote) {
          broadcastState({ type: "slide-change", slideIndex: state.currentSlide, source: mode });
        }
      }

      function nextSlide() {
        goToSlide(state.currentSlide + 1, { source: mode });
      }

      function prevSlide() {
        goToSlide(state.currentSlide - 1, { source: mode });
      }

      function firstSlide() {
        goToSlide(0, { source: mode });
      }

      function lastSlide() {
        goToSlide(slides.length - 1, { source: mode });
      }

      function handleKeyboardNavigation(event) {
        if (isEditableTarget(event.target)) return;

        switch (event.key) {
          case "ArrowRight":
          case " ":
          case "Spacebar":
            event.preventDefault();
            nextSlide();
            break;
          case "ArrowLeft":
            event.preventDefault();
            prevSlide();
            break;
          case "Home":
            event.preventDefault();
            firstSlide();
            break;
          case "End":
            event.preventDefault();
            lastSlide();
            break;
          default:
            break;
        }
      }

      function safeParse(payload) {
        try { return JSON.parse(payload); } catch (_) { return null; }
      }

      function processMessage(data) {
        if (!data || typeof data !== "object") return;
        if (data.channel && data.channel !== channelName) return;
        if (data.source === mode) return;

        if (data.type === "slide-change" && Number.isFinite(data.slideIndex)) {
          goToSlide(data.slideIndex, { remote: true });
          setSyncStatus("Sync: Connected");
        }

        if (data.type === "end-presenter") {
          if (mode === "audience") {
            if (state.presenterWindow && !state.presenterWindow.closed) state.presenterWindow.close();
            state.presenterWindow = null;
            setSyncStatus("Presenter mode: Off");
          } else {
            window.close();
          }
        }

        if (data.type === "handshake") {
          setSyncStatus("Sync: Connected");
          state.syncConnected = true;
          if (mode === "audience") {
            broadcastState({ type: "slide-change", slideIndex: state.currentSlide, source: mode });
          }
        }
      }

      function initSync() {
        if (typeof BroadcastChannel !== "undefined") {
          state.channel = new BroadcastChannel(channelName);
          state.channel.addEventListener("message", (event) => processMessage(event.data));
          state.syncTransport = "BroadcastChannel";
          setSyncStatus(mode === "audience" ? "Presenter mode: Ready" : "Sync: Connected");
          state.syncConnected = true;
        } else {
          let storageAvailable = false;
          try {
            localStorage.setItem("__sync_test__", "1");
            localStorage.removeItem("__sync_test__");
            storageAvailable = true;
          } catch (_) {
            storageAvailable = false;
          }

          window.addEventListener("message", (event) => {
            if (!event || !event.data) return;
            processMessage(event.data);
          });

          if (storageAvailable) {
            window.addEventListener("storage", (event) => {
              if (event.key !== state.storageKey || !event.newValue) return;
              const parsed = safeParse(event.newValue);
              processMessage(parsed);
            });
            state.syncTransport = "window messaging + storage";
            setSyncStatus(mode === "audience" ? "Presenter mode: Ready" : "Sync: Limited (fallback)", false);
          } else {
            state.syncTransport = "window messaging only";
            setSyncStatus(
              mode === "audience"
                ? "Presenter mode: Limited sync (fallback)"
                : "Sync: Limited (fallback)",
              true
            );
          }
        }
      }

      function broadcastState(payload) {
        const message = { ...payload, channel: channelName, source: mode, sentAt: Date.now() };

        if (state.channel) {
          state.channel.postMessage(message);
        }

        if (mode === "audience" && state.presenterWindow && !state.presenterWindow.closed) {
          state.presenterWindow.postMessage(message, "*");
        }

        if (mode === "presenter" && window.opener && !window.opener.closed) {
          window.opener.postMessage(message, "*");
        }

        try {
          localStorage.setItem(state.storageKey, JSON.stringify(message));
        } catch (_) {
          // localStorage may be blocked under file:// in some environments.
        }
      }

      function openPresenterMode() {
        if (state.presenterWindow && !state.presenterWindow.closed) {
          state.presenterWindow.focus();
          setSyncStatus(`Presenter mode: Active (${state.syncTransport || "ready"})`);
          return;
        }

        const url = new URL(window.location.href);
        url.searchParams.set("mode", "presenter");
        url.searchParams.set("channel", channelName);
        url.searchParams.set("slide", String(state.currentSlide));

        const features = "popup=yes,width=1280,height=820,resizable=yes,scrollbars=yes";
        const popup = window.open(url.toString(), "savingMoneyPresenter", features);

        if (!popup) {
          els.popupWarning.classList.remove("hidden");
          els.popupWarning.innerHTML = "Presenter window was blocked by your browser. Please allow popups for this file, then click <strong>Start Presenter Mode</strong> again.";
          setSyncStatus("Presenter mode: Popup blocked", true);
          return;
        }

        els.popupWarning.classList.add("hidden");
        state.presenterWindow = popup;
        setSyncStatus(`Presenter mode: Active (${state.syncTransport || "ready"})`);
        broadcastState({ type: "handshake" });

        const popupClosedCheck = window.setInterval(() => {
          if (!state.presenterWindow || state.presenterWindow.closed) {
            window.clearInterval(popupClosedCheck);
            state.presenterWindow = null;
            setSyncStatus("Presenter mode: Off");
          }
        }, 900);
      }

      function endPresenterMode() {
        broadcastState({ type: "end-presenter" });
        if (mode === "audience") {
          if (state.presenterWindow && !state.presenterWindow.closed) state.presenterWindow.close();
          state.presenterWindow = null;
          setSyncStatus("Presenter mode: Off");
        }
      }

      async function toggleFullscreen() {
        if (!document.fullscreenEnabled) {
          if (mode === "audience") {
            els.popupWarning.classList.remove("hidden");
            els.popupWarning.textContent = "Fullscreen is not supported in this browser context. The presentation remains fully usable.";
          }
          return;
        }

        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (_) {
          if (mode === "audience") {
            els.popupWarning.classList.remove("hidden");
            els.popupWarning.textContent = "Fullscreen request was denied. Continue presenting in windowed mode.";
          }
        }
      }

      function updateFullscreenButton() {
        if (mode !== "audience") return;
        const active = Boolean(document.fullscreenElement);
        els.fullscreenBtn.textContent = active ? "Exit Fullscreen" : "Enter Fullscreen";
      }

      function initTimer() {
        state.startTime = Date.now();
        window.setInterval(() => {
          const elapsed = Math.max(0, Math.floor((Date.now() - state.startTime) / 1000));
          els.timer.textContent = formatTime(elapsed);
        }, 500);
      }

      function renderPreviewShell() {
        if (mode !== "presenter") return;
        renderPresenterData();
      }

      function bindCommonEvents() {
        document.addEventListener("keydown", handleKeyboardNavigation);
      }

      function bindAudienceEvents() {
        els.prevBtn.addEventListener("click", prevSlide);
        els.nextBtn.addEventListener("click", nextSlide);
        els.startPresenterBtn.addEventListener("click", openPresenterMode);
        els.fullscreenBtn.addEventListener("click", toggleFullscreen);
        document.addEventListener("fullscreenchange", updateFullscreenButton);
      }

      function bindPresenterEvents() {
        els.presenterPrevBtn.addEventListener("click", prevSlide);
        els.presenterNextBtn.addEventListener("click", nextSlide);
        els.focusAudienceBtn.addEventListener("click", () => {
          if (window.opener && !window.opener.closed) {
            window.opener.focus();
          } else {
            els.presenterFinalState.textContent = "Audience window is unavailable. Keep presenting from this window.";
          }
        });
        els.endPresenterBtn.addEventListener("click", endPresenterMode);

        window.addEventListener("beforeunload", () => {
          broadcastState({ type: "end-presenter" });
          cleanup();
        });
      }

      function cleanup() {
        if (state.channel) {
          try {
            state.channel.close();
          } catch (_) {
            // no-op
          }
        }
      }

      function initAudience() {
        els.slideMount = $("slideMount");
        els.slideCounter = $("slideCounter");
        els.progressNav = $("progressNav");
        els.prevBtn = $("prevBtn");
        els.nextBtn = $("nextBtn");
        els.startPresenterBtn = $("startPresenterBtn");
        els.syncStatus = $("syncStatus");
        els.popupWarning = $("popupWarning");
        els.deckLabel = $("deckLabel");
        els.fullscreenBtn = $("fullscreenBtn");

        renderAudienceSlide();
        renderProgressIndicators();
        bindAudienceEvents();
        setSyncStatus(state.syncStatusMessage || "Presenter mode: Ready", state.syncWarn);
      }

      function initPresenter() {
        $("audienceApp").classList.add("hidden");
        $("presenterApp").classList.remove("hidden");

        els.presenterTitle = $("presenterTitle");
        els.presenterSlideIndicator = $("presenterSlideIndicator");
        els.presenterCurrentPreview = $("presenterCurrentPreview");
        els.presenterNotes = $("presenterNotes");
        els.presenterNextPreview = $("presenterNextPreview");
        els.presenterPrevBtn = $("presenterPrevBtn");
        els.presenterNextBtn = $("presenterNextBtn");
        els.presenterSyncState = $("presenterSyncState");
        els.presenterFinalState = $("presenterFinalState");
        els.focusAudienceBtn = $("focusAudienceBtn");
        els.endPresenterBtn = $("endPresenterBtn");
        els.timer = $("timer");

        renderPreviewShell();
        bindPresenterEvents();
        initTimer();
        setSyncStatus(state.syncStatusMessage || "Sync: Connected", state.syncWarn);

        if (!window.opener || window.opener.closed) {
          setSyncStatus("Sync: Unavailable (no audience window)", true);
          els.presenterFinalState.textContent = "This presenter view was opened without an audience window. You can still use it for notes practice.";
        } else {
          broadcastState({ type: "handshake" });
          broadcastState({ type: "slide-change", slideIndex: state.currentSlide });
        }
      }

      function bootstrap() {
        initSync();
        bindCommonEvents();

        if (mode === "audience") {
          initAudience();
        } else {
          initPresenter();
        }
      }

      window.addEventListener("beforeunload", cleanup);
      bootstrap();
    })();
  </script>
